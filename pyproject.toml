[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-ai-workspace"
version = "0.1.0"
description = "Local-first, Claude-inspired AI workspace with custom LLM providers and native MCP support"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shoaib Santo" }]
keywords = ["ai", "llm", "mcp", "chat", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "mcp>=1.1.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.0",
    "platformdirs>=4.3.0",
    "aiohttp>=3.10.0",
    "keyring>=25.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.7.0"]

[project.scripts]
local-ai = "local_ai_workspace.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/local_ai_workspace"]
artifacts = ["src/local_ai_workspace/static/**"]
